name: Build and test (no deployment)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bundle exec jekyll build --strict_front_matter
      - run: bundle exec ruby tests/site_test.rb
      - run: node --test tests/progress.test.cjs
